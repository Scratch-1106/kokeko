<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジムバトル</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #1e272e; color: white; margin: 0; padding: 20px; }
    .card { background: #2f3640; border: 4px solid #fbc531; border-radius: 15px; padding: 20px; max-width: 400px; margin: 0 auto; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
    .spot-photo { width: 100%; height: 180px; object-fit: cover; border-radius: 10px; border: 2px solid #fbc531; margin-bottom: 10px; }
    #spotDesc { font-size: 13px; color: #a4b0be; background: #1e272e; padding: 8px 12px; border-radius: 8px; margin-bottom: 15px; text-align: left; border-left: 3px solid #fbc531; }
    button { background: #fbc531; color: black; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%; }
    button:disabled { background: #57606f; cursor: not-allowed; color: #dcdde1; }
    .warning-msg { color: #ff6b6b; font-size: 14px; margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="header-container"></div>

  <div class="card">
    <img id="spotPhoto" src="" alt="ジムの写真" class="spot-photo" onerror="this.style.display='none'">
    <div id="spotDesc">読み込み中...</div>
    <h1 id="spotTitle">ジム</h1>
    <p id="gymStatus">防衛情報を取得中...</p>
    <div id="qrWarning" class="warning-msg" style="display: none;">現地（QRコード経由）でアクセスしていません</div>
    <button id="actionBtn" onclick="takeGym()">ジムにポケモンを置く</button>
    <br><br>
    <a href="index" style="color: #808e9b; text-decoration: none;">← マップに戻る</a>
  </div>

  <script src="spots.js"></script>
  <script>
    const API_BASE = "https://gentle-breeze-835b.3-s.workers.dev/";

    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('header-container').innerHTML = data;
        const myName = localStorage.getItem("myPlayerName") || "名無しプレイヤー";
        const myTeam = localStorage.getItem("myTeam") || "blue";
        const nameSpan = document.getElementById("headerAccountName");
        if (nameSpan) nameSpan.innerText = myName;
        const teamSpan = document.getElementById("headerTeamName");
        if (teamSpan) {
          if (myTeam === "blue") { teamSpan.innerText = "青チーム"; teamSpan.style.color = "#00a8ff"; }
          else if (myTeam === "red") { teamSpan.innerText = "赤チーム"; teamSpan.style.color = "#e84118"; }
          else if (myTeam === "yellow") { teamSpan.innerText = "黄チーム"; teamSpan.style.color = "#fbc531"; }
        }
      });

    const urlParams = new URLSearchParams(window.location.search);
    let spotId = urlParams.get("id") || "reizouko";
    if (spotId.includes("/")) spotId = spotId.split("/")[0];
    const hasValidQR = urlParams.get("qr") === "open";

    if (hasValidQR) {
      window.history.replaceState(null, '', `gym?id=${spotId}`);
    }

    const spotInfo = SPOT_DATA[spotId] || { name: spotId, desc: "説明文なし", photo: "photo.jpg" };
    document.getElementById("spotTitle").innerText = `⚔️ ${spotInfo.name}`;
    document.getElementById("spotPhoto").src = spotInfo.photo;
    document.getElementById("spotDesc").innerText = spotInfo.desc;

    const actionBtn = document.getElementById("actionBtn");
    const qrWarning = document.getElementById("qrWarning");
    const statusText = document.getElementById("gymStatus");

    if (!hasValidQR) {
      actionBtn.disabled = true;
      actionBtn.innerText = "現地に行ってください";
      qrWarning.style.display = "block";
    }

    async function loadGymData() {
      try {
        const res = await fetch(`${API_BASE}/api/spot?id=${spotId}`);
        const data = await res.json();
        statusText.innerText = `現在のオーナー: ${data.owner} (${data.team})`;
      } catch (e) {
        statusText.innerText = "データを取得できませんでした";
      }
    }

    async function takeGym() {
      if (!hasValidQR) return;
      const myName = localStorage.getItem("myPlayerName") || "名無しプレイヤー";
      const myTeam = localStorage.getItem("myTeam") || "blue";

      actionBtn.disabled = true;
      actionBtn.innerText = "送信中...";

      try {
        const res = await fetch(`${API_BASE}/api/gym/update`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: spotId, owner: myName, team: myTeam })
        });
        const result = await res.json();
        if (result.success) {
          alert("ジムを制圧しました！");
          loadGymData();
        }
      } catch (e) {
        alert("通信エラーが発生しました");
      } finally {
        actionBtn.disabled = false;
        actionBtn.innerText = "ジムにポケモンを置く";
      }
    }

    loadGymData();
  </script>
</body>
</html>
